apiVersion: v1
kind: ConfigMap
metadata:
  name: pvc-backup
  namespace: cryo
  labels:
    go-cryo.github.com/config: "true"
data:
  config: |
    type: pvc
    schedule: "0 4 * * *"
    repositoryRef: "cryo/my-repo"
    pvc:
      claimName: my-application-data
      volumeSnapshotClassName: csi-hostpath-snapclass
      snapshotRetention: 3
      # Staging PVC class; defaults to the source PVC's class. Set this when the
      # source class uses reclaimPolicy Retain — otherwise every run leaves a
      # Released PV holding a full volume clone.
      stagingStorageClassName: csi-hostpath-sc
    retention:
      keepLast: 7
      keepDaily: 30
      keepWeekly: 12
      keepMonthly: 6
