apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cryo
  namespace: cryo
  labels:
    app.kubernetes.io/name: cryo
    app.kubernetes.io/component: controller
rules:
  # Repository hosts, repositories, and backup job credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # Backup job configs and controller settings
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # Backup execution jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "watch"]

  # Cleanup of completed job pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "deletecollection"]

  # Staging PVCs and PVC backup orchestration
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "delete"]

  # VolumeSnapshots for PVC backups
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "create", "delete"]
