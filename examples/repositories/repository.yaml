apiVersion: v1
kind: Secret
metadata:
  name: my-repo
  namespace: cryo
  labels:
    go-cryo.github.com/repository: "true"
type: Opaque
stringData:
  # Reference to a repository host (namespace/name)
  HOST_REF: "cryo/my-s3-host"
  # Path within the host - appended to the host's BASE_URL
  PATH: "backups/production"
  # Encryption password for the restic repository
  RESTIC_PASSWORD: "a-strong-restic-encryption-password"
