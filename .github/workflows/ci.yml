name: CI

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -v -race -count=1 ./...
      - name: Build controller
        run: go build ./cmd/controller/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Local registry for backup images
      - name: Start local registry
        run: |
          docker run -d --restart=always -p 5001:5000 --name kind-registry registry:2

      # Build backup images and push to local registry
      - name: Build and push backup images
        run: |
          docker build -f docker/psql.Dockerfile -t localhost:5001/cryo-psql:test hack/backup
          docker build -f docker/s3.Dockerfile -t localhost:5001/cryo-s3:test hack/backup
          docker build -f docker/pvc.Dockerfile -t localhost:5001/cryo-pvc:test hack/backup
          docker push localhost:5001/cryo-psql:test
          docker push localhost:5001/cryo-s3:test
          docker push localhost:5001/cryo-pvc:test

      # KIND cluster with registry access
      - name: Create KIND cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cryo-e2e
          config: test/e2e/kind-config.yaml

      # Connect registry to KIND network
      - name: Connect registry to KIND
        run: |
          docker network connect kind kind-registry || true
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/kind/main/site/static/examples/kind-registry/configmap.yaml || true

      # Install snapshot infrastructure for PVC backup tests
      - name: Install snapshot-controller
        run: |
          kubectl create namespace snapshot-controller --dry-run=client -o yaml | kubectl apply -f -
          helm repo add piraeus https://piraeus.io/helm-charts --force-update
          helm install snapshot-controller piraeus/snapshot-controller --namespace snapshot-controller --wait

      - name: Install CSI hostpath driver
        run: |
          git clone --branch v1.17.0 --depth 1 https://github.com/kubernetes-csi/csi-driver-host-path.git /tmp/csi-driver
          DEPLOY_DIR="$(ls -d /tmp/csi-driver/deploy/kubernetes-* | sort | tail -1)"
          "${DEPLOY_DIR}/deploy.sh"

      - name: Wait for CSI driver ready
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=csi-hostpathplugin --timeout=120s 2>/dev/null || \
          kubectl wait --for=condition=Ready pod -l app=csi-hostpathplugin --timeout=120s 2>/dev/null || \
          sleep 30

      - name: Apply storage classes
        run: kubectl apply -f hack/storage-class.yml

      - name: Run E2E tests
        run: go test -v -tags=e2e -count=1 -timeout=15m ./test/e2e/...
        env:
          CRYO_PSQL_IMAGE: localhost:5001/cryo-psql:test
          CRYO_S3_IMAGE: localhost:5001/cryo-s3:test
          CRYO_PVC_IMAGE: localhost:5001/cryo-pvc:test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose

  release:
    name: Create release
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Changelog
        uses: scottbrenner/generate-changelog-action@master
        id: changelog
        env:
          REPO: ${{ github.repository }}
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  build:
    needs: [test, e2e, gitleaks]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      packages: write
    strategy:
      matrix:
        image:
          - name: controller
            dockerfile: docker/controller.Dockerfile
            context: .
            suffix: ""
            build_args: VERSION=${{ github.ref_name }}
          - name: psql
            dockerfile: docker/psql.Dockerfile
            context: hack/backup
            suffix: "-psql"
            build_args: ""
          - name: s3
            dockerfile: docker/s3.Dockerfile
            context: hack/backup
            suffix: "-s3"
            build_args: ""
          - name: pvc
            dockerfile: docker/pvc.Dockerfile
            context: hack/backup
            suffix: "-pvc"
            build_args: ""
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKER_IMAGE_URL: ghcr.io/${{ github.repository }}${{ matrix.image.suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On tag push: push by digest (no arch-suffixed tag)
      - name: Build and push by digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ matrix.image.build_args }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE_URL }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # On non-tag: build only (verify the image builds)
      - name: Build (no push)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ matrix.image.build_args }}
          push: false

  manifest:
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - name: controller
            suffix: ""
          - name: psql
            suffix: "-psql"
          - name: s3
            suffix: "-s3"
          - name: pvc
            suffix: "-pvc"
    env:
      DOCKER_IMAGE_URL: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKER_IMAGE_URL }}:${{ github.ref_name }} \
            -t ${{ env.DOCKER_IMAGE_URL }}:latest \
            $(printf '${{ env.DOCKER_IMAGE_URL }}@sha256:%s ' *)
